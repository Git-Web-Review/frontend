worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The container runs unprivileged: everything nginx writes has to live
    # under /tmp.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The equivalent of Vite's `server.allowedHosts`: filled in at start-up from
    # FRONTEND_ALLOWED_HOSTS, with the same semantics as the backend and
    # websocket relay lists.
    include /tmp/nginx/allowed-hosts.conf;

    server {
        # `listen <port>;`, rendered at start-up from PORT.
        include /tmp/nginx/listen.conf;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Runtime configuration: generated outside the served root so that root
        # stays immutable, and never cached.
        location = /config.js {
            alias /tmp/nginx/config.js;
            default_type application/javascript;
            include /etc/nginx/host-guard.conf;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # The filenames Vite produces carry a content hash.
        location /assets/ {
            include /etc/nginx/host-guard.conf;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # index.html must be revalidated, or a new build stays invisible.
        location = /index.html {
            include /etc/nginx/host-guard.conf;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Single-page app: any unknown route renders the app.
        location / {
            include /etc/nginx/host-guard.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
