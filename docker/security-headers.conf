# Included by every block that sets its own add_header: nginx stops inheriting
# the parent block's headers as soon as a block declares one of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# allow-popups: Firebase sign-in goes through a popup window.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
